name: Monthly tracker reset
on:
  schedule:
    # Earlier than daily scrape; scheduled execution order is not guaranteed.
    - cron: "30 4 1 * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: tracker-writer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Refresh before archive and reset
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: git pull --ff-only origin "$TARGET_BRANCH"
      - name: Archive and reset tracker
        run: python -m src.reset_tracker
      - name: Preserve archived and fresh tracker
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-reset-${{ github.run_id }}
          path: |
            archive/
            data/job_tracker.xlsx
            docs/index.html
      - name: Commit archived and fresh tracker
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "job-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/job_tracker.xlsx archive/ docs/index.html
          if ! git diff --staged --quiet; then
            git commit -m "Monthly tracker reset"
            git push origin "HEAD:$TARGET_BRANCH"
          fi
