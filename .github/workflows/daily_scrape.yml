name: Daily job scrape

on:
  # Runs daily at 06:30 Munich time — pushed an hour earlier than the
  # original 07:30 plan, to give the now-longer run (roughly 60-90
  # minutes with 764 companies across both sheets) more buffer to
  # finish before a typical morning check. GitHub Actions cron is
  # always UTC and has no concept of daylight saving, so this is a
  # genuine tradeoff, not an oversight: 04:30 UTC = 06:30 CEST (summer,
  # what Munich is on right now) but only 05:30 CET in winter — the
  # run will land an hour earlier, local time, once clocks go back. If
  # you want it pinned to exactly 06:30 year-round, say so and I'll
  # add a second cron line for the winter months instead of this
  # single one.
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch: {}   # still lets you trigger it manually from the Actions tab too

permissions:
  contents: write   # needed so the workflow can commit the updated Excel file back

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install headless browser (for JS-rendered career sites)
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        run: python -m src.main

      - name: Commit updated tracker
        run: |
          git config user.name "job-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/job_tracker.xlsx docs/index.html
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Daily job scrape update"
          git push
