name: Daily job scrape

on:
  schedule:
    - cron: "0 19 * * *"
      timezone: "Europe/Berlin"
  workflow_dispatch:
    inputs:
      audit_munich_sources_only:
        description: "Test extraction for new Munich sustainability boards and repaired sources without updating the tracker or deploying"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tracker-writes
  cancel-in-progress: false
jobs:
  scrape:
    if: github.event_name != 'workflow_dispatch' || !inputs.audit_munich_sources_only
    permissions:
      contents: write
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt lxml
          python -m pip install "playwright>=1.40,<2"

      - name: Install headless browser (for JS-rendered career sites)
        run: python -m playwright install --with-deps chromium

      - name: Check source syntax and installed dependencies
        run: |
          python -m compileall -q src
          python -m pip check
          python run.py --check-config
          python -m unittest discover -s tests -p test_munich_tracker.py
      - name: Run scraper
        env:
          SCRAPE_TIER: all
        run: |
          set -o pipefail
          mkdir -p diagnostics
          rm -f docs/scraper_health.json
          python -m src.main 2>&1 | tee diagnostics/scrape.log
      - name: Save diagnostic report even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-diagnostics-${{ github.run_id }}
          path: |
            diagnostics/scrape.log
            docs/scraper_health.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit updated tracker
        run: |
          git config user.name "job-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/job_tracker.xlsx docs/index.html
          if [ -f docs/scraper_health.json ]; then
            git add docs/scraper_health.json
          fi
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Daily job scrape update"
          git pull --rebase --autostash origin main
          git push
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare public site files
        run: |
          mkdir -p public-site
          cp docs/index.html public-site/index.html
          if [ -f docs/scraper_health.json ]; then
            cp docs/scraper_health.json public-site/scraper_health.json
          fi
      - name: Upload public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public-site
  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tracker website
        id: deployment
        uses: actions/deploy-pages@v4

  audit-munich-sources:
    if: github.event_name == 'workflow_dispatch' && inputs.audit_munich_sources_only
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt lxml
          python -m pip install 'playwright>=1.40,<2'
          python -m playwright install --with-deps chromium
      - name: Validate new and repaired sources without changing tracker data
        run: python -m src.validate_sources --expansion --seconds 90 --output diagnostics/munich-source-validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: munich-source-validation
          path: diagnostics/munich-source-validation.json
          if-no-files-found: warn
