name: Daily job scrape

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tracker-writes
  cancel-in-progress: false
jobs:
  scrape:
    permissions:
      contents: write
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install headless browser (for JS-rendered career sites)
        run: python -m playwright install --with-deps chromium

      - name: Check source syntax and installed dependencies
        run: |
          python -m compileall -q src
          python -m pip check
      - name: Run scraper
        run: |
          set -o pipefail
          mkdir -p diagnostics
          rm -f docs/scraper_health.json
          python -m src.main 2>&1 | tee diagnostics/scrape.log
      - name: Save diagnostic report even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-diagnostics-${{ github.run_id }}
          path: |
            diagnostics/scrape.log
            docs/scraper_health.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit updated tracker
        run: |
          git config user.name "job-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/job_tracker.xlsx docs/index.html
          if [ -f docs/scraper_health.json ]; then
            git add docs/scraper_health.json
          fi
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Daily job scrape update"
          git pull --rebase --autostash origin main
          git push
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare public site files
        run: |
          mkdir -p public-site
          cp docs/index.html public-site/index.html
      - name: Upload public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public-site
  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tracker website
        id: deployment
        uses: actions/deploy-pages@v4
