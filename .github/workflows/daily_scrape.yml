name: Job scrape (manual)

on:
  # No automatic schedule — this runs only when you click "Run workflow"
  # on the Actions tab (or trigger it from the API/CLI). If you ever
  # want it back on a schedule, uncomment the block below.
  # schedule:
  #   - cron: "0 5 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated Excel file back

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install headless browser (for JS-rendered career sites)
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        run: python -m src.main

      - name: Commit updated tracker
        run: |
          git config user.name "job-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/job_tracker.xlsx docs/index.html
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Daily job scrape update"
          git push
