name: Daily job scrape

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tracker-writes
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install headless browser (for JS-rendered career sites)
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        run: python -m src.main

      - name: Commit updated tracker
        run: |
          git config user.name "job-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/job_tracker.xlsx docs/index.html
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Daily job scrape update"
          git pull --rebase --autostash origin main
          git push
