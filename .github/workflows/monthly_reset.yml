name: Tracker reset (manual)

on:
  # No automatic schedule — this runs only when you click "Run workflow"
  # on the Actions tab. If you ever want the automatic monthly reset
  # back, uncomment the block below.
  # schedule:
  #   - cron: "30 5 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Archive and reset tracker
        run: python -m src.reset_tracker

      - name: Commit archived + fresh tracker
        run: |
          git config user.name "job-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/job_tracker.xlsx archive/ docs/index.html
          git commit -m "Monthly tracker reset" || echo "Nothing to commit"
          git push
