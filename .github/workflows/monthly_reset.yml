name: Tracker reset (manual)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tracker-writes
  cancel-in-progress: false
jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Archive and reset tracker
        run: python -m src.reset_tracker

      - name: Commit archived + fresh tracker
        run: |
          git config user.name "job-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/job_tracker.xlsx archive/ docs/index.html
          git commit -m "Monthly tracker reset" || echo "Nothing to commit"
          git pull --rebase --autostash origin main
          git push
