name: Audit all Munich job sources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boards:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      SCRAPE_TIER: all
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r requirements.txt lxml 'playwright>=1.40,<2'
          python -m playwright install --with-deps chromium
          python run.py --check-config
      - run: python -m tools.full_source_audit --shard ${{ matrix.shard }} --output audit-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: board-audit-part-${{ matrix.shard }}
          path: audit-output/
          if-no-files-found: warn
          retention-days: 7
  combined:
    if: ${{ !cancelled() }}
    needs: boards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt lxml
      - uses: actions/download-artifact@v4
        with:
          pattern: board-audit-part-*
          path: parts
      - run: python -m tools.full_source_audit --merge parts --output combined-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: munich-all-source-audit
          path: combined-audit/
          if-no-files-found: warn
          retention-days: 14
