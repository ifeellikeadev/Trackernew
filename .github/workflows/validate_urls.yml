name: Validate company URLs

on:
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run URL validator
        run: |
          set -o pipefail
          mkdir -p diagnostics
          python -m src.validate_urls 2>&1 | tee diagnostics/url-validation.log
      - name: Save URL validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: url-validation-${{ github.run_id }}
          path: diagnostics/url-validation.log
          if-no-files-found: warn
          retention-days: 14
