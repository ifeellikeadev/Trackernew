# Derived from Giorgio Nudi's CV. Edit freely as the CV evolves —
# nothing here is fetched automatically, you keep it in sync by hand.
#
# title_must_match:
#   A job's TITLE must contain at least one of these (case-insensitive)
#   to be picked up at all. This is what keeps the tracker to
#   "PM / Program Manager roles only" as requested. Includes English,
#   German, and now local-language variants for the dream-cities
#   countries (Danish, Norwegian, Finnish, Dutch, French) — many
#   companies post in English internationally, but domestic/public-
#   sector roles often don't, and those were silently failing this
#   filter before reaching location or scoring at all.
title_must_match:
  - "project manager"
  - "programme manager"
  - "program manager"
  - "projektmanager"
  - "projektleiter"
  - "senior project manager"
  - "technical project manager"
  - "it project manager"
  - "delivery manager"
  - "projektleder"       # Danish
  - "prosjektleder"      # Norwegian
  - "projektipäällikkö"  # Finnish
  - "projektipaallikko"  # Finnish, no diacritics
  - "projectmanager"     # Dutch
  - "projectleider"      # Dutch
  - "chef de projet"     # French
  - "gestionnaire de projet"  # French
  - "project lead"
  - "program lead"
  - "delivery lead"
  - "portfolio manager"
  - "pmo manager"
  - "implementation manager"

# Titles that would otherwise pass title_must_match above (they
# contain "Projektleiter"/"Project Manager") but are a completely
# different kind of role — confirmed from real postings Giorgio
# flagged as irrelevant, not guessed:
#   - "Projektleiter Stadionbau" -> stadium construction, requires a
#     civil engineering/architecture degree, tagged "Construction" by
#     the source site itself
#   - "Projektleiter Elektrotechnik" -> electrical trades project lead
# "Projektleiter" is an extremely broad term in German-speaking
# markets — it covers construction site leads, HVAC leads, electrical
# trade leads, none of which are the kind of PM role this tool is
# meant to surface. If you flag more irrelevant postings later, check
# whether they share a domain word like these — that's the pattern to
# extend, not one-off exact titles.
title_must_not_match:
  - "stadionbau"
  - "elektrotechnik"
  - "hochbau"
  - "wohnungsbau"
  - "museumsbau"
  - "tiefbau"
  - "rohbau"
  - "gebäudetechnik"
  - "gebaudetechnik"
  - "hlk"                    # HVAC (Heizung/Lüftung/Klima)
  - "sanitärtechnik"
  - "sanitartechnik"
  - "bauleiter"
  - "bauen im bestand"
  - "schlüsselfertig"
  - "schlusselfertig"
  - "mieterausbau"
  - "dachgeschossausbau"

# main_min_score / swiss_min_score:
#   Minimum Relevance Score (1-10) a posting needs to appear on that
#   sheet at all — applied retroactively every run too (rows already
#   in a sheet get pruned if they'd no longer qualify), not just as a
#   gate on new additions. Both set to 3 — company-count growth
#   (agencies/job boards, the Swiss city expansion) pushed volume up
#   enough that a floor is worth having.
# (dream_city_min_score removed — Dream Cities is no longer scraped
# at all, per a scope refocus to Munich + Swiss cities only.)
main_min_score: 3
swiss_min_score: 3

# score_ceiling:
#   Used to convert the raw keyword-weight sum into a 1-10 scale shown
#   in the Excel tracker (10 = best match). Raise this if scores are
#   clustering too high (e.g. everything shows 9-10); lower it if
#   scores are clustering too low (e.g. everything shows 1-2).
#   Lowered from 15 to 12: many platforms (SmartRecruiters, Workday,
#   generic HTML) don't expose full description text, so those
#   postings can only be scored on title words alone — a lower
#   ceiling means a modest title-only match isn't automatically
#   floored out. Personio's feed now also gets its full description
#   parsed (previously left blank), which helps more directly.
score_ceiling: 20

# scoring_keywords:
#   Each match inside the job description adds "weight" points toward
#   the raw score above, which then gets converted to the 1-10 scale.
#   Used to rank/sort results, not to filter them out.
scoring_keywords:
  # Aerospace/defence — weighted clearly above energy/regulatory below,
  # per direct feedback: real CV fit is stronger there, and scoring
  # should reflect that rather than treating every domain as equal.
  - {term: "aerospace", weight: 5}
  - {term: "Luft- und Raumfahrt", weight: 5}
  - {term: "Luftfahrt", weight: 5}
  - {term: "defence", weight: 5}
  - {term: "defense", weight: 5}
  - {term: "Verteidigung", weight: 5}
  - {term: "Wehrtechnik", weight: 5}
  - {term: "Rüstung", weight: 5}
  - {term: "military", weight: 4}
  - {term: "Militär", weight: 4}
  - {term: "militärisch", weight: 4}
  # Energy/regulatory — kept fully in place as requested, just no
  # longer tied with aerospace/defence at the same weight.
