# Staffing-agency job boards — genuinely different from companies.yaml
# and dream_cities.yaml: these are pre-filtered SEARCH RESULTS pages
# on a recruitment agency's own site, not one company's own career
# page. Kept in a separate file so it's easy to add, remove, or
# disable this category independently of direct-employer companies.
#
# Currently: Randstad, Michael Page, Robert Walters (Switzerland,
# Germany, Singapore), and EMEA Recruitment (Switzerland only — they
# specialize specifically in Procurement & Supply Chain, a strong
# match for the CV). Hays was checked and deliberately left out: no
# clean pre-filtered search URL could be verified — their Switzerland
# page is a filter-driven interface, not a simple query URL like the
# others, so nothing was added rather than guessing one.
#
# IMPORTANT, READ BEFORE ADDING MORE: many agency listings anonymize
# the real hiring company ("Our client is a leading..."), so rows
# sourced from here will show the AGENCY's name (e.g. "Randstad
# Switzerland") in the tracker's Company column, not the actual
# employer — you'll need to click through to find that out, same as
# you would have needed to manually. This is a real, known trade-off,
# not a bug. Verified NOT to include LinkedIn, Indeed, or Glassdoor —
# all three have anti-scraping enforcement and ToS that explicitly
# prohibit this, unlike a recruitment agency's own public listings
# page, which exists specifically to be found by candidates.
#
# Same schema as companies.yaml. "city" here is just a nominal
# placeholder — since each URL is a country-wide (not city-specific)
# search, the ACTUAL routing to Jobs/Singapore & Swiss Cities/Dream
# Cities is driven by each individual posting's own location text via
# the any-city matching (src/matcher.py), exactly like every other
# entry — not by this field.
