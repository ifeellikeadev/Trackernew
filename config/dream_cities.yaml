# Dream-city expansion. Same format as companies.yaml, plus a
# "country" field (used in the tracker's Dream Cities sheet).
#
# Scope reasoning (see chat for full discussion): these are cities
# where an Italian citizen + Nepali spouse have a realistic, non-
# lottery path to a visa — EU/EEA free movement (Denmark, Norway,
# Finland, Austria), Switzerland's bilateral EU agreement, or
# established skilled-migration programs (Canada, Australia,
# Singapore). The US was deliberately left out: H-1B is a random
# lottery with no reliable planning path.
#
# Only postings scoring 7+ (see cv_profile.yaml, dream_city_min_score)
# make it into the tracker from this list — it's meant to surface
# only your strongest matches, not general coverage the way the main
# Munich/Zurich list is.
