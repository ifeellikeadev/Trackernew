# Target companies for the career-page job scraper.
#
# HOW TO EDIT THIS FILE:
#   - "name"        : display name, shown in the Excel tracker
#   - "city"         : Munich or Zurich (used for grouping/filtering)
#   - "careers_url"  : the company's careers/jobs landing page
#   - "ats"          : which job board platform they use, or "auto" if unknown.
#                       Supported values: greenhouse, lever, smartrecruiters,
#                       personio, workday, auto
#   - "board_token"  : only needed for greenhouse/lever/smartrecruiters —
#                       leave blank ("") if unknown, the scraper will try to
#                       guess it from the company name, but it's safer to fill
#                       it in yourself once you find it (see SETUP_GUIDE.md,
#                       section "Adding or fixing a company").
#
# To add a new company later: copy one block, fill in the fields, save.
# To remove one: delete its block (or comment it out with a leading '#').

